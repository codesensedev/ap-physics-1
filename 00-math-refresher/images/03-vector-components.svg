<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" width="660" height="420" role="img" aria-labelledby="t d">
<title id="t">A vector resolved into components</title>
<desc id="d">Vector A at angle theta above the x-axis. Its x-component A cos theta lies along the x-axis; its y-component A sin theta is vertical. Together they form a right triangle with A as hypotenuse.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<line x1="65.2" y1="350" x2="613.85" y2="350" stroke="#1b1f24" stroke-width="2" stroke-linecap="butt"/>
<polygon points="623.2,350 612.2,354.62 612.2,345.38" fill="#1b1f24"/>
<line x1="90" y1="374.8" x2="90" y2="30.75" stroke="#1b1f24" stroke-width="2" stroke-linecap="butt"/>
<polygon points="90,21.4 94.62,32.4 85.38,32.4" fill="#1b1f24"/>
<text x="619.2" y="378" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#1b1f24" text-anchor="middle" font-style="italic"><tspan dy="0">x</tspan></text>
<text x="70" y="29.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#1b1f24" text-anchor="middle" font-style="italic"><tspan dy="0">y</tspan></text>
<line x1="90" y1="350" x2="331.19" y2="350" stroke="#23844a" stroke-width="5" stroke-linecap="butt"/>
<polygon points="343.94,350 328.94,356.3 328.94,343.7" fill="#23844a"/>
<line x1="343.94" y1="350" x2="343.94" y2="184.94" stroke="#d9680f" stroke-width="5" stroke-linecap="butt"/>
<polygon points="343.94,172.19 350.24,187.19 337.64,187.19" fill="#d9680f"/>
<line x1="90" y1="350" x2="333.49" y2="179.5" stroke="#1f5fbf" stroke-width="5" stroke-linecap="butt"/>
<polygon points="343.94,172.19 335.26,185.96 328.04,175.63" fill="#1f5fbf"/>
<path d="M 164.4 350 A 74.4 74.4 0 0 0 150.94 307.33" fill="none" stroke="#1b1f24" stroke-width="2" stroke-linecap="round"/>
<text x="187.57" y="326.24" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#1b1f24" text-anchor="middle" font-style="italic"><tspan dy="0">θ</tspan></text>
<polyline points="330.3,350 330.3,336.36 343.94,336.36" fill="none" stroke="#1b1f24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="194.97" y="249.1" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="24" fill="#1f5fbf" text-anchor="middle" font-style="italic" font-weight="bold"><tspan dy="0">A</tspan></text>
<text x="216.97" y="384" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#23844a" text-anchor="middle" font-weight="bold"><tspan dy="0">A</tspan><tspan dy="5.6" font-size="14.4">x</tspan><tspan dx="6.4" dy="-5.6">= A cos θ</tspan></text>
<text x="359.94" y="267.1" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#d9680f" text-anchor="start" font-weight="bold"><tspan dy="0">A</tspan><tspan dy="5.6" font-size="14.4">y</tspan><tspan dx="6.4" dy="-5.6">= A sin θ</tspan></text>
</svg>
