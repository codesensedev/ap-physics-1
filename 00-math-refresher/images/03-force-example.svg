<title id="t">A 50 newton pull at 30 degrees above horizontal</title>
<desc id="d">A box on the floor is pulled by a rope with force 50 N at 30 degrees above the horizontal. The horizontal component is 43.3 N and the vertical component is 25.0 N.</desc>
