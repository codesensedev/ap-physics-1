<text x="233.6" y="242.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#1b1f24" text-anchor="middle"><tspan dy="0">box</tspan></text>
<line x1="306.4" y1="230.2" x2="536.99" y2="230.2" stroke="#23844a" stroke-width="4" stroke-linecap="butt" stroke-dasharray="8 6"/>
<polygon points="548.89,230.2 534.89,236.08 534.89,224.32" fill="#23844a"/>
<line x1="548.89" y1="230.2" x2="548.89" y2="102.1" stroke="#d9680f" stroke-width="4" stroke-linecap="butt" stroke-dasharray="8 6"/>
<polygon points="548.89,90.2 554.77,104.2 543.01,104.2" fill="#d9680f"/>
<line x1="306.4" y1="230.2" x2="537.85" y2="96.58" stroke="#1f5fbf" stroke-width="5" stroke-linecap="butt"/>
<polygon points="548.89,90.2 539.05,103.16 532.75,92.24" fill="#1f5fbf"/>
<polyline points="536.57,230.2 536.57,217.88 548.89,217.88" fill="none" stroke="#1b1f24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 390.4 230.2 A 84 84 0 0 0 379.15 188.2" fill="none" stroke="#1b1f24" stroke-width="2" stroke-linecap="round"/>
<text x="417.29" y="206.49" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19" fill="#1b1f24" text-anchor="middle"><tspan dy="0">30°</tspan></text>
<text x="417.64" y="148.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#1f5fbf" text-anchor="end" font-style="italic" font-weight="bold"><tspan dy="0">F = 50 N</tspan></text>
<text x="427.64" y="260.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#23844a" text-anchor="middle" font-weight="bold"><tspan dy="0">F</tspan><tspan dy="5.6" font-size="14.4">x</tspan><tspan dx="6.4" dy="-5.6">= 43.3 N</tspan></text>
<text x="562.89" y="166.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#d9680f" text-anchor="start" font-weight="bold"><tspan dy="0">F</tspan><tspan dy="5.6" font-size="14.4">y</tspan><tspan dx="6.4" dy="-5.6">= 25.0 N</tspan></text>
</svg>
