<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t d">
<title id="t">Vector addition, tip to tail</title>
<desc id="d">Vector A is drawn first, then vector B starting at the tip of A. The resultant R = A + B runs from the tail of A to the tip of B. Its components are the sums of the components.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<line x1="70" y1="340" x2="70" y2="28" stroke="#e3e7ec" stroke-width="1" stroke-linecap="round"/>
<line x1="130" y1="340" x2="130" y2="28" stroke="#e3e7ec" stroke-width="1" stroke-linecap="round"/>
<line x1="190" y1="340" x2="190" y2="28" stroke="#e3e7ec" stroke-width="1" stroke-linecap="round"/>
<line x1="250" y1="340" x2="250" y2="28" stroke="#e3e7ec" stroke-width="1" stroke-linecap="round"/>
<line x1="310" y1="340" x2="310" y2="28" stroke="#e3e7ec" stroke-width="1" stroke-linecap="round"/>
<line x1="370" y1="340" x2="370" y2="28" stroke="#e3e7ec" stroke-width="1" stroke-linecap="round"/>
<line x1="430" y1="340" x2="430" y2="28" stroke="#e3e7ec" stroke-width="1" stroke-linecap="round"/>
<line x1="70" y1="340" x2="430" y2="340" stroke="#e3e7ec" stroke-width="1" stroke-linecap="round"/>
<line x1="70" y1="280" x2="430" y2="280" stroke="#e3e7ec" stroke-width="1" stroke-linecap="round"/>
<line x1="70" y1="220" x2="430" y2="220" stroke="#e3e7ec" stroke-width="1" stroke-linecap="round"/>
<line x1="70" y1="160" x2="430" y2="160" stroke="#e3e7ec" stroke-width="1" stroke-linecap="round"/>
<line x1="70" y1="100" x2="430" y2="100" stroke="#e3e7ec" stroke-width="1" stroke-linecap="round"/>
<line x1="70" y1="40" x2="430" y2="40" stroke="#e3e7ec" stroke-width="1" stroke-linecap="round"/>
<line x1="70" y1="340" x2="297.63" y2="283.09" stroke="#1f5fbf" stroke-width="5" stroke-linecap="butt"/>
<polygon points="310,280 296.98,289.75 293.92,277.53" fill="#1f5fbf"/>
<line x1="310" y1="280" x2="394.3" y2="111.4" stroke="#d9680f" stroke-width="5" stroke-linecap="butt"/>
<polygon points="400,100 398.93,116.23 387.66,110.6" fill="#d9680f"/>
<line x1="70" y1="340" x2="389.69" y2="107.5" stroke="#1b1f24" stroke-width="5" stroke-linecap="butt"/>
<polygon points="400,100 391.57,113.92 384.16,103.73" fill="#1b1f24"/>
<text x="190" y="344" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="24" fill="#1f5fbf" text-anchor="middle" font-style="italic" font-weight="bold"><tspan dy="0">A</tspan></text>
<text x="369" y="196" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="24" fill="#d9680f" text-anchor="start" font-style="italic" font-weight="bold"><tspan dy="0">B</tspan></text>
<text x="223" y="206" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#1b1f24" text-anchor="end" font-style="italic" font-weight="bold"><tspan dy="0">R = A + B</tspan></text>
<text x="439" y="124" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19" fill="#8a929b" text-anchor="start" font-weight="bold"><tspan dy="0">Add the components:</tspan></text>
<text x="439" y="166" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#1b1f24" text-anchor="start"><tspan dy="0">R</tspan><tspan dy="5.6" font-size="14.4">x</tspan><tspan dx="6.4" dy="-5.6">= A</tspan><tspan dy="5.6" font-size="14.4">x</tspan><tspan dx="6.4" dy="-5.6">+ B</tspan><tspan dy="5.6" font-size="14.4">x</tspan></text>
<text x="439" y="193" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#1b1f24" text-anchor="start"><tspan dy="0">= 4 + 1.5 = 5.5</tspan></text>
<text x="439" y="241" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#1b1f24" text-anchor="start"><tspan dy="0">R</tspan><tspan dy="5.6" font-size="14.4">y</tspan><tspan dx="6.4" dy="-5.6">= A</tspan><tspan dy="5.6" font-size="14.4">y</tspan><tspan dx="6.4" dy="-5.6">+ B</tspan><tspan dy="5.6" font-size="14.4">y</tspan></text>
<text x="439" y="268" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#1b1f24" text-anchor="start"><tspan dy="0">= 1 + 3 = 4</tspan></text>
</svg>
